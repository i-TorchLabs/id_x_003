name: id_x_003

services:
  db:
    image: docker.io/library/postgres:18
    container_name: id_x_003_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - id_x_003_db_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_003/ops/Dockerfile.service
    image: id_x_003_service:latest
    container_name: id_x_003_service
    restart: unless-stopped
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PROJECT_PATH: /app/i-Torch
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: id_x_003_web:latest
    container_name: id_x_003_web
    restart: unless-stopped
    depends_on:
      - service

  haproxy:
    image: docker.io/library/haproxy:3.2
    container_name: id_x_003_haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      SERVICE_HOST: service
      WEB_HOST: web
    ports:
      - "8003:8080"
    depends_on:
      - service
      - web

volumes:
  id_x_003_db_data:
