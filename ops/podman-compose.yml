name: id_x_003

services:
  db:
    image: postgres:18
    container_name: id_x_003_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - id_x_003_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_003/ops/Dockerfile.service
    container_name: id_x_003_service
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PROJECT_PATH: /app/i-Torch
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: id_x_003_web
    depends_on:
      - service

  haproxy:
    image: haproxy:3
    container_name: id_x_003_haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8003:8080"
    depends_on:
      - service
      - web

volumes:
  id_x_003_db_data:
