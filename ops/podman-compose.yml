name: id_x_003

services:
  db:
    image: docker.io/library/postgres:18
    container_name: id_x_003_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "35432:5432"
    volumes:
      - id_x_003_db_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_003/ops/Dockerfile.service
    image: id_x_003_service:latest
    container_name: id_x_003_service
    restart: unless-stopped
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AA_MAIL_PASSWORD: ${AA_MAIL_PASSWORD:-}
      # ADFS OAuth2 授权码流（client_secret 仅存服务端，严禁进入 web 容器）
      AA_OAUTH_CLIENT_ID: ${AA_OAUTH_CLIENT_ID:-}
      AA_OAUTH_CLIENT_SECRET: ${AA_OAUTH_CLIENT_SECRET:-}
      AA_OAUTH_REDIRECT_URI: ${AA_OAUTH_REDIRECT_URI:-}
      # 以下为可选调优项（默认值见 x_oauth.py，一般无需设置）：
      # AA_OAUTH_UPN_CLAIM / AA_OAUTH_EMAIL_CLAIM: 钉死 ADFS 身份声明名（默认自动探测 upn/unique_name、email/mail）
      # AA_OAUTH_CLOCK_SKEW_SECONDS: exp 校验容忍的服务器时钟偏移（默认 300）
      # AA_OAUTH_NONCE: 置 1 启用 /token 防重放 nonce（部分 ADFS 版本对 resource 参数报错，默认关）
      AA_OAUTH_UPN_CLAIM: ${AA_OAUTH_UPN_CLAIM:-}
      AA_OAUTH_EMAIL_CLAIM: ${AA_OAUTH_EMAIL_CLAIM:-}
      AA_OAUTH_CLOCK_SKEW_SECONDS: ${AA_OAUTH_CLOCK_SKEW_SECONDS:-300}
      AA_OAUTH_NONCE: ${AA_OAUTH_NONCE:-}
      PROJECT_PATH: /app/i-Core
      TZ: Asia/Shanghai
    volumes:
      # 日志挂载:宿主机 x_models/id_x_003/logs -> 容器日志目录 /app/i-Core/logs
      # (日志路径由 utils/log_util.py 按 PROJECT_PATH + config 中 logs/*.log 解析)
      - ../logs:/app/i-Core/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: id_x_003_web:latest
    container_name: id_x_003_web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - service

  haproxy:
    image: docker.io/library/haproxy:3.2
    container_name: id_x_003_haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      SERVICE_HOST: service
      WEB_HOST: web
    ports:
      - "8003:8080"
    depends_on:
      - service
      - web

volumes:
  id_x_003_db_data:
