global
    maxconn 2048

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 600s

frontend http_in
    bind *:8080
    option httpchk GET /health
    http-check expect rstatus 200|400
    acl is_api path_beg /b/id_x_003/
    use_backend service_backend if is_api
    default_backend web_backend

backend service_backend
    server service 127.0.0.1:7000 check

backend web_backend
    server web 127.0.0.1:2000 check
