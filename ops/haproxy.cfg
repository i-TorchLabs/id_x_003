# 通用配置：后端主机由环境变量注入
#   Pod 模式(up.sh)：SERVICE_HOST/WEB_HOST = 127.0.0.1（共享网络命名空间）
#   compose 模式：   SERVICE_HOST=service, WEB_HOST=web（DNS 服务名互访）
#
# TLS（漏洞报告 #3 建议②：登录信息加密传输）：
#   默认 HTTP(8080)。若提供证书则启用 HTTPS(8443) 并将 HTTP 强制跳转 HTTPS。
#   证书：将 fullchain.pem+私钥 合并为 /usr/local/etc/haproxy/certs/site.pem 挂载进容器，
#   并设置环境变量 TLS_ENABLED=true。未设置则保持纯 HTTP（仅限内网/测试）。
global
    maxconn 2048
    # TLS 默认收紧：仅 TLSv1.2+，禁弱套件
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 600s

frontend http_in
    bind *:8080
    # TLS_ENABLED=true 时启用下行 bind；否则注释掉下一行以保持纯 HTTP
    #bind *:8443 ssl crt /usr/local/etc/haproxy/certs/site.pem
    option httpchk GET /
    http-check expect rstatus ^[1-4]

    # 强制 HTTPS：若经 8080(HTTP) 访问且 TLS 已启用，则 301 跳转到 8443
    # （TLS_ENABLED=true 时取消下行注释）
    #http-request redirect scheme https code 301 if { ssl_fc -m not }

    # 安全响应头（纵深防御）
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer
    # TLS 启用时取消下行注释，强制浏览器后续走 HTTPS
    #http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # 学生端 SSO 入口（对应原 nginx: location ~/s/ { return 301 ...; }）：
    # /s/ 前缀一律 301 跳转到 CUHK ADFS OAuth2 授权端点，回调地址为前端 /f/aa/user/oauth2/
    acl is_sso path_beg /s/
    http-request redirect location "https://sts.cuhk.edu.cn/adfs/oauth2/authorize?client_id=da02397b-7289-4ae9-b2ee-bfafb0dc0e33&response_type=id_token+token&redirect_uri=https://sme-cloud.cuhk.edu.cn/f/aa/user/oauth2/&nonce=sme-aa" code 301 if is_sso

    acl is_api path_beg /b/id_x_003/
    use_backend service_backend if is_api
    default_backend web_backend

backend service_backend
    server service "${SERVICE_HOST}:7000" check

backend web_backend
    server web "${WEB_HOST}:2000" check
